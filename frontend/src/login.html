<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chrome, Opera, and Firefox OS -->
    <meta name="theme-color" content="#1f2024" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#3a3f51" />
    <!-- Android/Apple Phone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="description" content="Talearr" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Content/Images/Icons/apple-touch-icon.png?v=talearr"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Content/Images/Icons/favicon-32x32.png?v=talearr"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Content/Images/Icons/favicon-16x16.png?v=talearr"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/Content/Images/Icons/favicon.svg?v=talearr"
    />
    <link rel="manifest" href="/Content/Images/Icons/manifest.json?v=talearr" crossorigin="use-credentials" />
    <link
      rel="mask-icon"
      href="/Content/Images/Icons/safari-pinned-tab.svg?v=talearr"
      color="#ec703e"
    />
    <meta
      name="msapplication-config"
      content="/Content/Images/Icons/browserconfig.xml?v=talearr"
    />

    <!-- NOTE: The main UI uses a hashed stylesheet; the login page is intentionally self-styled to avoid hardcoding a build hash here. -->
    <link rel="stylesheet" type="text/css" href="/Content/Fonts/fonts.css" />

    <title>Login - Talearr</title>

    <style>
      /* Talearr sign-in: dark charcoal page, one dark card, orange accents. */
      :root {
        color-scheme: dark;

        --page-bg: #1f2024;
        --page-glow-from: #25262a;
        --page-glow-to: #18191c;
        --card-bg: #2b2c30;
        --card-border: #3d3e43;
        --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);

        --text: #f1f1f2;
        --label: #c0c0c5;
        --muted: #8e8f96;

        --input-bg: #25262a;
        --input-border: #3d3e43;
        --input-text: #f1f1f2;
        --input-placeholder: #77787f;

        --accent: #ec703e;
        --accent-hover: #f2814f;
        --accent-text: #1b1310;
        --focus-ring: 0 0 0 3px rgba(236, 112, 62, 0.35);

        --error-text: #ff8a80;
        --error-bg: rgba(255, 82, 82, 0.1);
        --error-border: rgba(255, 82, 82, 0.35);

        --secondary-bg: #25262a;
        --secondary-hover-bg: #303136;

        --plex-bg: #e5a00d;
        --plex-hover-bg: #f0ad1b;
        --plex-text: #1b1310;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background-color: var(--page-bg);
        background-image: radial-gradient(120% 80% at 50% 0%, var(--page-glow-from) 0%, var(--page-glow-to) 70%);
        background-attachment: fixed;
        color: var(--text);
        font-family: "Roboto", "open sans", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .center {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: clamp(28px, 10vh, 120px) 16px 32px;
        min-height: 100vh;
      }

      .content {
        width: 100%;
        max-width: 400px;
      }

      .panel {
        padding: 32px 28px 28px;
        border: 1px solid var(--card-border);
        border-radius: 18px;
        background-color: var(--card-bg);
        box-shadow: var(--card-shadow);
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo {
        display: block;
        width: 88px;
        height: 88px;
      }

      /* Talearr wordmark: "Tale" plus "arr" in the brand orange */
      .wordmark {
        margin-top: 10px;
        color: var(--text);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }

      .wordmark-accent {
        color: var(--accent);
      }

      .sign-in {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .form-group {
        margin: 18px 0 0;
      }

      .form-label {
        display: block;
        margin-bottom: 6px;
        color: var(--label);
        font-weight: 500;
        font-size: 13px;
      }

      .form-input {
        padding: 10px 14px;
        width: 100%;
        height: 44px;
        border: 1px solid var(--input-border);
        border-radius: 10px;
        background-color: var(--input-bg);
        color: var(--input-text);
        font-size: 15px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .form-input::placeholder {
        color: var(--input-placeholder);
      }

      .form-input:focus {
        outline: 0;
        border-color: var(--accent);
        box-shadow: var(--focus-ring);
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-top: 22px;
        padding: 12px 16px;
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background-color: var(--accent);
        color: var(--accent-text);
        vertical-align: middle;
        text-align: center;
        white-space: nowrap;
        line-height: normal;
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        transition: background-color 0.15s, box-shadow 0.15s;
      }

      .button:hover {
        background-color: var(--accent-hover);
        color: var(--accent-text);
        text-decoration: none;
      }

      .button:focus-visible {
        outline: 0;
        box-shadow: var(--focus-ring);
      }

      .button-secondary {
        border: 1px solid var(--card-border);
        background-color: var(--secondary-bg);
        color: var(--text);
      }

      .button-secondary:hover {
        background-color: var(--secondary-hover-bg);
        color: var(--text);
      }

      .button-plex {
        background-color: var(--plex-bg);
        color: var(--plex-text);
      }

      .button-plex:hover {
        background-color: var(--plex-hover-bg);
        color: var(--plex-text);
      }

      .copy {
        margin-top: 18px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      .remember-me-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        line-height: 25px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        color: var(--label);
        font-size: 14px;
      }

      .remember-me input {
        margin: 0 8px 0 0;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .forgot-password {
        margin-left: auto;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
      }

      .forgot-password:focus,
      .forgot-password:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .forgot-password:visited {
        color: var(--muted);
      }

      .login-failed {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid var(--error-border);
        border-radius: 10px;
        background-color: var(--error-bg);
        color: var(--error-text);
        font-size: 14px;
      }

      .sso-container {
        margin-top: 20px;
      }

      .sso-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .toggle-local {
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
      }

      .toggle-local a {
        color: var(--muted);
        text-decoration: none;
      }

      .toggle-local a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .hidden {
        display: none;
      }

      @media only screen and (max-width: 480px) {
        .center {
          padding-top: 28px;
        }

        .panel {
          padding: 26px 20px 22px;
        }

        .logo {
          width: 76px;
          height: 76px;
        }

        .form-input {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="center">
      <div class="content">
        <div class="panel">
          <div class="brand">
            <img src="/Content/Images/talearr-icon.png" alt="Talearr Logo" class="logo" />
            <div class="wordmark">Tale<span class="wordmark-accent">arr</span></div>
            <div class="sign-in">Sign in to continue</div>
          </div>

          <div class="panel-body">
            <form
              id="local-login-form"
              role="form"
              data-parsley-validate=""
              novalidate=""
              class="mb-lg"
              method="POST"
            >
              <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input
                  type="email"
                  id="username"
                  name="username"
                  class="form-input"
                  placeholder="Username"
                  autocomplete="off"
                  pattern=".{1,}"
                  required
                  title="User name is required"
                  autoFocus="true"
                  autoCapitalize="false"
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Password"
                  required
                />
              </div>

              <div class="remember-me-container">
                <span class="remember-me">
                  <input
                    type="checkbox"
                    name="rememberMe"
                    id="rememberMe"
                    checked="checked"
                  />
                  <label for="rememberMe">Remember Me</label>
                </span>

              </div>
              <button type="submit" class="button">Login</button>

              <div id="login-failed" class="login-failed hidden">
                Incorrect Username or Password
              </div>
              <div id="sso-failed" class="login-failed hidden"></div>
            </form>

            <div id="sso-container" class="sso-container hidden">
              <a id="plex-login" class="button button-plex hidden" href="#">Continue with Plex</a>
              <a id="oidc-login" class="button hidden" href="#">Continue with SSO</a>
              <div id="sso-note" class="sso-note hidden">
                You will be redirected to your identity provider to sign in.
              </div>
            </div>

            <div id="local-login-toggle-container" class="toggle-local hidden">
              <a id="local-login-toggle" href="#">Use a local account instead</a>
            </div>
          </div>
        </div>

        <div id="copy" class="copy hidden">
          <span>&copy;</span>
          <span id="year"></span>
          <span>-</span>
          <span>Talearr</span>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var yearSpan = document.getElementById("year");
    yearSpan.innerHTML = "2017-" + new Date().getFullYear();

    var copyDiv = document.getElementById("copy");
    copyDiv.classList.remove("hidden");

    var authMethod = "__AUTH_METHOD__";
    var urlBase = "__URL_BASE__";

    var ssoContainer = document.getElementById("sso-container");
    var plexLoginLink = document.getElementById("plex-login");
    var oidcLoginLink = document.getElementById("oidc-login");
    var localLoginForm = document.getElementById("local-login-form");
    var ssoNote = document.getElementById("sso-note");
    var localLoginToggleContainer = document.getElementById("local-login-toggle-container");
    var localLoginToggle = document.getElementById("local-login-toggle");

    var urlParams = new URLSearchParams(window.location.search);
    var loginFailed = urlParams.get("loginFailed") === "true";
    var ssoFailed = urlParams.get("ssoFailed") === "true";
    var ssoError = urlParams.get("ssoError") || "";

    if (loginFailed) {
      var loginFailedDiv = document.getElementById("login-failed");
      loginFailedDiv.classList.remove("hidden");
    }

    if (ssoFailed) {
      var ssoFailedDiv = document.getElementById("sso-failed");
      var message = "SSO sign-in failed.";

      if (ssoError === "oidc_discovery_unreachable") {
        message =
          "SSO sign-in failed. Talearr could not retrieve the OpenID Connect discovery document from your identity provider. Check DNS/proxy/firewall from the server/container. If you require a proxy, set Talearr Proxy Mode to 'Proxy Everything'.";
      } else if (ssoError === "oidc_backchannel_timeout") {
        message =
          "SSO sign-in failed. Talearr timed out while contacting your identity provider. Check DNS/proxy/firewall from the server/container. If you require a proxy, set Talearr Proxy Mode to 'Proxy Everything'.";
      } else if (ssoError === "missing_callback_parameters") {
        message =
          "SSO sign-in failed. The callback URL was reached without the expected parameters. Check your identity provider flow (Authorization Code) and reverse proxy settings.";
      } else if (ssoError === "cookie_or_proxy_issue") {
        message =
          "SSO sign-in failed. This is often caused by blocked cookies or a reverse proxy misconfiguration.";
      }

      ssoFailedDiv.textContent = message;
      ssoFailedDiv.classList.remove("hidden");
    }

    var returnUrl = urlParams.get("returnUrl") || "/";
    var showLocalLogin = loginFailed || ssoFailed;

    if (localLoginToggle) {
      localLoginToggle.addEventListener("click", function (e) {
        e.preventDefault();
        localLoginForm.classList.remove("hidden");
        localLoginToggleContainer.classList.add("hidden");
      });
    }

    if (authMethod === "plex") {
      ssoContainer.classList.remove("hidden");
      plexLoginLink.classList.remove("hidden");
      ssoNote.classList.remove("hidden");
      plexLoginLink.href = urlBase + "/auth/plex?returnUrl=" + encodeURIComponent(returnUrl);
      ssoNote.textContent = "You will be redirected to Plex to sign in.";

      if (!showLocalLogin) {
        localLoginForm.classList.add("hidden");
        localLoginToggleContainer.classList.remove("hidden");
      }
    } else if (authMethod === "oidc") {
      ssoContainer.classList.remove("hidden");
      oidcLoginLink.classList.remove("hidden");
      ssoNote.classList.remove("hidden");
      oidcLoginLink.href = urlBase + "/auth/oidc?returnUrl=" + encodeURIComponent(returnUrl);
      ssoNote.textContent = "You will be redirected to your identity provider to sign in.";

      if (!showLocalLogin) {
        localLoginForm.classList.add("hidden");
        localLoginToggleContainer.classList.remove("hidden");
      }
    }
  </script>
</html>
