name: TaleArr CI

# Builds and tests the TaleArr fork on one Linux runner. This is the check to
# watch after merging upstream Chaptarr changes: it fails if the merge broke the
# build, the unit tests, or the TaleArr rebrand (build-tools/talearr_brand_check.py).
on:
  push:
    branches: [develop, main, 'feat/**', 'fix/**', 'sync/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: talearr-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: Guard - no merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- . ':!*.md'; then
            echo "Merge-conflict markers found in tracked files."
            exit 1
          fi

      - name: Guard - TaleArr rebrand intact
        run: python3 build-tools/talearr_brand_check.py

      - name: Versions
        run: build-tools/talearr_versions.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: yarn

      - name: Frontend - install
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Frontend - typecheck
        run: yarn typecheck

      - name: Frontend - build
        run: yarn build

      - name: Backend - restore
        run: |
          dotnet restore src/Chaptarr.NoTests.sln
          dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj

      - name: Backend - build
        run: dotnet build src/Chaptarr.NoTests.sln -c Release --no-restore

      - name: Backend - unit tests
        run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj -c Release --no-restore --logger "console;verbosity=minimal"
